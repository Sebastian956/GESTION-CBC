<title>Gestión Comercial CBC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Concept: oficina comercial de una empresa de ingeniería. Interfaz blanca con azul CBC, barra lateral clara, cifras en Sora, folios y montos en mono. El documento (cotización o factura) siempre se ve como papel blanco, igual que el PDF. */
:root{
  --font-display:'Sora',ui-sans-serif,system-ui,sans-serif;
  --font-body:'Public Sans',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --bg:#FAFBFE; --surface:#FFFFFF; --surface-2:#F5F8FC; --line:#E3E9F2; --fg:#0F1A33; --muted:#556280;
  --primary:#1855D6; --primary-strong:#0F3FA6; --primary-soft:#E7EFFD; --on-primary:#FFFFFF; --link:#1550C4; --navy:#0A245C;
  --good:#117A4D; --warn:#8F5A00; --bad:#B92D28; --info:#1550C4;
  --good-bg:color-mix(in srgb,var(--good) 12%,var(--surface));
  --warn-bg:color-mix(in srgb,var(--warn) 14%,var(--surface));
  --bad-bg:color-mix(in srgb,var(--bad) 11%,var(--surface));
  --info-bg:color-mix(in srgb,var(--info) 11%,var(--surface));
  --paper:#FFFFFF; --paper-ink:#18223A; --paper-muted:#667085; --paper-line:#D5DCE8; --paper-blue:#1855D6; --paper-navy:#0E4D7A; --paper-mid:#2E7CC0; --paper-sub:#1370B6; --paper-soft:#F3F6FC;
  --shadow:0 1px 2px rgba(15,26,51,.04),0 8px 24px -16px rgba(15,26,51,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1020; --surface:#121A2F; --surface-2:#18223B; --line:#26324D; --fg:#E7ECF8; --muted:#98A5C2;
    --primary:#2F6BEA; --primary-strong:#5B8DF5; --primary-soft:#172750; --link:#7CA2F7; --navy:#12306F; --info:#7CA2F7;
    --good:#4ECB92; --warn:#F2B84B; --bad:#FF8279;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1020; --surface:#121A2F; --surface-2:#18223B; --line:#26324D; --fg:#E7ECF8; --muted:#98A5C2;
  --primary:#2F6BEA; --primary-strong:#5B8DF5; --primary-soft:#172750; --link:#7CA2F7; --navy:#12306F; --info:#7CA2F7;
  --good:#4ECB92; --warn:#F2B84B; --bad:#FF8279;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font:500 11.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font:700 30px/1.1 var(--font-display);letter-spacing:-.02em;margin-top:5px;text-wrap:balance}

.app{display:grid;grid-template-columns:224px minmax(0,1fr);gap:22px;max-width:1360px;margin:0 auto;align-items:start}
.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:22px;min-height:calc(100vh - 32px);padding:6px 4px}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}
.mark{flex:none;width:42px;height:42px;border-radius:12px;background:var(--primary);color:#fff;display:grid;place-items:center;font:700 15px var(--font-display);letter-spacing:.02em;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand b{display:block;font:650 14.5px/1.15 var(--font-display);overflow-wrap:anywhere}
.brand small{color:var(--muted);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{position:relative;display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;border-radius:11px;padding:11px 12px;color:var(--muted);font-weight:500;text-align:left}
.nav button:hover{background:var(--surface);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--link);box-shadow:var(--shadow);font-weight:600}
.nav svg{flex:none;width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cnt{margin-left:auto;font:600 11px var(--font-mono);border-radius:99px;padding:1px 7px;background:var(--primary-soft);color:var(--link)}
.cnt.bad{background:var(--bad-bg);color:var(--bad)}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 10px;display:grid;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px}
.dot.off{background:var(--bad)}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:11px;padding:9px 15px;background:var(--primary);color:var(--on-primary);font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.danger{background:var(--surface);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:6px 11px;border-radius:9px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:default;filter:none}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-bottom:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.card-head h2{font:650 16px var(--font-display)}
.card-head span{font-size:12px;color:var(--muted)}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .val{font:700 29px/1.1 var(--font-display);letter-spacing:-.02em;margin:8px 0 6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.kpi.hero{background:linear-gradient(180deg,var(--primary-soft),var(--surface) 85%);border-color:color-mix(in srgb,var(--primary) 26%,var(--line))}
.kpi.hero .val{color:var(--link)}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px 3px 8px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}

.scroll{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{width:100%;border-collapse:collapse}
.tbl{min-width:760px}
th{font:500 11px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
td.mono{white-space:nowrap}
td small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
td .nm{font-weight:600;overflow-wrap:anywhere}

.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip b{font-family:var(--font-mono);font-weight:500;margin-left:5px;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.chip[aria-pressed="true"] b{color:#fff}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.search input{padding-left:34px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-width:0}
.inp:hover{border-color:color-mix(in srgb,var(--muted) 50%,var(--line))}
textarea.inp{resize:vertical;min-height:64px;line-height:1.4}
.field{display:grid;gap:5px;margin-bottom:12px;min-width:0}
.field label,.lbl2{font-size:12px;font-weight:600;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.hint{font-size:12px;color:var(--muted)}
.err{font-size:12.5px;color:var(--bad);margin:-6px 0 10px}

.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;font:650 16px var(--font-display);color:var(--fg);margin-bottom:5px}
.empty .btn{margin-top:14px}
.note{font-size:12.5px;padding:10px 13px;border-radius:11px;background:var(--info-bg);color:var(--fg);border:1px solid color-mix(in srgb,var(--info) 24%,var(--line));margin-bottom:14px}
.note.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 30%,var(--line))}

.alerts{display:flex;flex-direction:column;gap:9px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.alert .d{width:9px;height:9px;border-radius:50%;background:var(--bad)}
.alert .d.w{background:#E9A820}.alert .d.i{background:var(--primary)}
.alert p{font-size:13px;overflow-wrap:anywhere}
.alert small{display:block;color:var(--muted);font-size:12px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:11px;align-items:start;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2)}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--font-mono);background:var(--primary-soft);color:var(--link)}
.step.done .n{background:var(--good);color:#fff}
.step b{display:block;font-weight:600}
.step small{color:var(--muted);display:block;margin-bottom:8px}
.minilist .it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.minilist .it:first-child{border-top:0}
.minilist .it:hover .nm{color:var(--link)}
.minilist .nm{font-weight:600;overflow-wrap:anywhere}
.minilist small{color:var(--muted);font-size:12px}
.minilist .amt{text-align:right}

.chart svg{display:block;max-width:100%}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--muted);font:11px var(--font-mono)}
.bA{fill:var(--primary)}.bB{fill:#E9A820}
.vl{fill:var(--fg);font:600 11px var(--font-mono)}
.key{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.key i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* editor */
.edbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.edbar .ttl{flex:1 1 200px;min-width:0}
.edbar h1{font-size:26px;margin-top:2px}
.builder{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}
.sec{font:600 11.5px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.sec:first-child{margin-top:0;padding-top:0;border-top:0}
fieldset{border:0;padding:0;margin:0;min-width:0}
.cli-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.items-h,.item{display:grid;grid-template-columns:minmax(0,1fr) 58px 62px 104px auto;gap:8px;align-items:center}
.items-h{font:500 10.5px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;padding-right:0}
.item{margin-bottom:8px;grid-template-areas:"d d d d d" "u q p t x"}
.item{grid-template-columns:62px 62px minmax(0,1fr) auto 34px;grid-template-areas:"d d d d d" "u q p t x"}
.item .d{grid-area:d}.item .u{grid-area:u}.item .q{grid-area:q}.item .p{grid-area:p}.item .t{grid-area:t;font:500 12.5px var(--font-mono);color:var(--muted);text-align:right;min-width:92px}.item .x{grid-area:x}
.items-h{display:none}
.x{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;font-size:18px;line-height:1;padding:0}
.x:hover{color:var(--bad);border-color:var(--bad)}
.sum{display:grid;gap:5px;margin:14px 0;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:13px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .t{font:700 17px var(--font-display);padding-top:7px;border-top:1px solid var(--line);margin-top:4px}
.prev-col{position:sticky;top:16px;min-width:0}

.paper{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:26px;box-shadow:var(--shadow);border:1px solid var(--paper-line);font-size:12px;line-height:1.4;min-width:0}
.paper *{border-color:var(--paper-line)}
.p-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.p-issuer{display:flex;gap:11px;min-width:0;flex:1 1 200px}
.p-logo{flex:none;width:46px;height:46px;border-radius:9px;background:var(--paper-blue);color:#fff;display:grid;place-items:center;font:700 14px var(--font-display);overflow:hidden}
.p-logo.img{background:none;width:auto;max-width:130px;height:46px;border-radius:0}
.p-logo img{height:100%;max-width:130px;object-fit:contain}
.p-issuer b{display:block;font:700 14px/1.2 var(--font-display);overflow-wrap:anywhere}
.p-issuer span{display:block;color:var(--paper-muted);font-size:11px}
.p-box{border:2px solid var(--paper-blue);color:var(--paper-blue);text-align:center;padding:9px 14px;border-radius:5px;display:grid;gap:3px;flex:0 1 190px;align-content:center}
.p-box b{font:700 13px var(--font-display);letter-spacing:.03em}
.p-box span{font:500 12px var(--font-mono)}
.p-box em{font-style:normal;color:var(--paper-muted);font-size:11px}
.p-meta{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:3px 12px;padding:11px 12px;background:var(--paper-soft);border-radius:6px;margin-bottom:12px}
.p-meta dt{color:var(--paper-muted)}.p-meta dd{margin:0;overflow-wrap:anywhere;font-weight:500}
.p-lines{width:100%}
.p-lines th{color:#fff;background:var(--paper-blue);padding:6px 6px;font:600 10px var(--font-mono);letter-spacing:.04em}
.p-lines td{border-bottom:1px solid var(--paper-line);padding:7px 6px;overflow-wrap:anywhere;vertical-align:top}
.p-lines td.r,.p-lines th.r{text-align:right;white-space:nowrap}
.p-bot{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.p-words{flex:1 1 180px;color:var(--paper-muted);font-size:11px;align-self:flex-end}
.p-totals{flex:0 1 250px;width:250px;max-width:100%;display:grid;gap:4px}
.p-totals div{display:flex;justify-content:space-between;gap:10px}
.p-totals .t{font-weight:700;font-size:14px;background:var(--paper-blue);color:#fff;border-radius:5px;padding:6px 9px;margin-top:3px}
.p-cond{margin-top:14px;padding-top:10px;border-top:1px solid var(--paper-line);display:grid;gap:8px;color:var(--paper-ink)}
.p-cond h4{margin:0 0 2px;font:600 10.5px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--paper-muted)}
.p-cond p{white-space:pre-line;overflow-wrap:anywhere}
.p-foot{margin-top:14px;color:var(--paper-muted);font-size:10.5px}
.builder.wide{grid-template-columns:minmax(0,1fr);max-width:1080px}.builder.wide .prev-col{position:static}
.pp-title{background:var(--paper-navy);color:#fff;border-radius:6px;padding:10px 14px;margin:0 0 10px}
.pp-title b{display:block;font:700 14px var(--font-display)}.pp-title span{font-size:11px;opacity:.88}
.pp-intro{margin:0 0 4px;color:var(--paper-ink);white-space:pre-line;overflow-wrap:anywhere}
.pp-sec{margin-top:14px}
.pp-sh{background:var(--paper-navy);color:#fff;font:700 12px var(--font-display);padding:8px 10px;border-radius:5px 5px 0 0;overflow-wrap:anywhere}
.pp-scroll{overflow-x:auto}
.pp-t{width:100%;border-collapse:collapse;font-size:11px}
.pp-t th{background:var(--paper-mid);color:#fff;font:600 10px var(--font-mono);padding:6px;text-align:right;white-space:nowrap}
.pp-t th.l{text-align:left}
.pp-t td{padding:5px 6px;border-bottom:1px solid var(--paper-line);vertical-align:top;overflow-wrap:anywhere}
.pp-t td.r{text-align:right;white-space:nowrap;font-family:var(--font-mono);font-size:10.5px}
.pp-t tr.g td{background:var(--paper-soft);font-weight:700;color:var(--paper-navy)}
.pp-t tr.sub td{background:var(--paper-sub);color:#fff;font-weight:700}
.pp-t tr.dsc td{color:var(--paper-muted);font-style:italic}
.pp-t tr.tot td{background:#1D1E1C;color:#fff;font-weight:700}
.sed{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--surface)}
.sed-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:10px}
.sed-h .mv{display:flex;gap:4px}
.tag{font:600 10.5px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--primary);background:var(--surface-2);padding:5px 8px;border-radius:7px;white-space:nowrap}
.sed-sc{overflow-x:auto;padding-bottom:4px}
.sed-t{border-collapse:separate;border-spacing:0 6px;min-width:100%}
.sed-t th{font:500 10.5px var(--font-mono);color:var(--muted);text-align:left;padding:0 6px 0 0;white-space:nowrap;font-weight:500}
.sed-t td{padding:0 6px 0 0;vertical-align:middle}
.sed-t .inp{min-width:104px}.sed-t td:first-child .inp,.sed-t th:first-child{min-width:210px}
.sed-t .lh{display:flex;gap:4px;align-items:center}.sed-t .lh .x{width:30px;height:30px;flex:none}
.sed-t .tt{font:500 12px var(--font-mono);color:var(--muted);text-align:right;white-space:nowrap}
.sed-g{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:6px;margin:12px 0 8px}
.sed-it{display:grid;grid-template-columns:minmax(0,1fr) 78px 72px 130px 34px;gap:6px;margin-bottom:6px}
.sed-f{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:8px;margin-top:12px}
.sed-sum{margin-top:10px;padding:9px 12px;background:var(--surface-2);border-radius:10px;font-size:12.5px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 14px}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
@media(max-width:640px){.sed-it{grid-template-columns:62px 62px minmax(0,1fr) 34px}.sed-it>:first-child{grid-column:1/-1}.sed-it>:nth-child(2){grid-column:1}}


/* proyectos */
.track{position:relative;height:9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.fill{height:100%;border-radius:99px;background:var(--primary)}
.plan{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.5;border-radius:2px}
.meter{margin-bottom:12px}
.meter-l{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:6px;color:var(--muted)}
.meter-l b{color:var(--fg);font-weight:600}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:none;border:0;border-radius:7px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.pj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px}
.pj{cursor:pointer;transition:border-color .15s,transform .15s}
.pj:hover{border-color:color-mix(in srgb,var(--primary) 45%,var(--line));transform:translateY(-1px)}
.pj-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:14px}
.pj h3{font:650 16px/1.25 var(--font-display);overflow-wrap:anywhere}
.pj small{color:var(--muted);font-size:12.5px;display:block;margin-top:3px;overflow-wrap:anywhere}
.pj-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:4px}
.pj-mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px 26px}
.pj-mini .it{cursor:pointer}
.pj-mini .it:hover .nm{color:var(--link)}
.pj-mini .nm{font-weight:600;overflow-wrap:anywhere}
.pj-mini .row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:7px}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.task .row2{grid-column:1/-1;display:grid;gap:8px;align-items:center}
.rg{display:flex;align-items:center;gap:8px}
.rg input{flex:1;min-width:0;accent-color:var(--primary)}
.rg span{min-width:38px;text-align:right;font-size:12px}
.big{font:700 34px/1 var(--font-display);letter-spacing:-.02em}
.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
.sumgrid div{padding:11px 12px;border-radius:12px;background:var(--surface-2)}
.sumgrid small{display:block;color:var(--muted);font-size:12px}
.sumgrid b{font:650 15px var(--font-display)}
.g{min-width:560px}
.g-row{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px;align-items:center;margin:7px 0}
.g-lab{font-size:12.5px;font-weight:500;overflow-wrap:anywhere;line-height:1.25}
.g-lab small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.g-track{position:relative;height:24px;background:var(--surface-2);border-radius:7px}
.g-axis{background:none;height:16px}
.g-axis span{position:absolute;top:0;font:500 10.5px var(--font-mono);color:var(--muted);transform:translateX(3px);white-space:nowrap}
.g-axis .g-hoy{color:var(--bad);transform:translateX(-50%);font-weight:600}
.g-tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.g-today{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bad);border-radius:2px;z-index:2}
.g-bar{position:absolute;top:4px;bottom:4px;border-radius:6px;background:color-mix(in srgb,var(--c) 20%,var(--surface));border:1px solid var(--c);overflow:hidden;z-index:1}
.g-fill{height:100%;background:var(--c);opacity:.9}
.chev{min-height:0;min-width:0;height:18px;line-height:1;display:inline-grid;place-items:center;width:18px;height:18px;flex:none;border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;border-radius:5px;padding:0;margin-right:2px;vertical-align:middle}
.chev:hover{background:var(--surface-2);color:var(--fg)}.chev.sp{cursor:default}.chev.sp:hover{background:none}
.g-lab{display:flex;align-items:center;gap:2px}.g-lab .gl-t{flex:1;min-width:0}
.g-lab.grp{font-weight:650}.g-lab .gl-t{vertical-align:middle}
.g-bar.grp{top:7px;bottom:7px;border-radius:3px;border-width:1.5px}
.task .tn{display:flex;align-items:center;gap:4px;min-width:0}.task .tn .inp{flex:1;min-width:0}
.task .tb{display:flex;gap:4px;align-items:center}.task .tb .x{width:30px;height:34px;font-size:14px}
.task.tsum{background:var(--surface-2);border-radius:10px;padding:8px;border-bottom:0}.task.tsum .tn .inp{font-weight:650}
.task .sumrow{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}.task .sumrow b{color:var(--fg)}
.task .row2{grid-template-columns:1fr 1fr 1.3fr 1fr}
.girow{display:grid;grid-template-columns:minmax(0,1fr) 124px 150px 34px;gap:6px;margin-bottom:8px}.girow textarea{grid-column:1/-1}
.sii{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:var(--surface);font-size:13px}
.sii h4{margin:0 0 8px;font:600 11.5px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sii li{list-style:none;display:flex;gap:8px;padding:2px 0}.sii ul{margin:0;padding:0}.sii .ok{color:var(--good)}.sii .no{color:var(--bad)}
.sii .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(max-width:640px){.task .row2{grid-template-columns:1fr 1fr}.task .row2 .rg{grid-column:1/-1}.girow{grid-template-columns:minmax(0,1fr) 34px}.girow>*{grid-column:1/-1}.girow>.x{grid-column:2;grid-row:1}.girow>:first-child{grid-column:1}}


/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(8,12,22,.52);z-index:40;display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 70px -24px rgba(0,0,0,.55)}
.dlg h2{font:700 19px var(--font-display);margin-bottom:14px}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.radio{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.radio input{accent-color:var(--primary)}

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF=new Intl.NumberFormat('es-CL',{maximumFractionDigits:0});
const NF2=new Intl.NumberFormat('es-CL',{maximumFractionDigits:2});
const clp=n=>'$'+NF.format(Math.round(n||0));
const short=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1).replace('.',',')+' M':n>=1e3?NF.format(Math.round(n/1e3))+' mil':String(Math.round(n));
const MONTHS=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MFULL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const WD=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const todayD=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const todayS=()=>iso(todayD());
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffD=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const fmtD=s=>{if(!s)return '';const d=parse(s);return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()};
const fmtDL=s=>{const d=parse(s);return d.getDate()+' de '+MFULL[d.getMonth()]+' de '+d.getFullYear()};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const num=v=>{const n=Number(v);return isFinite(n)?n:0};

/* RUT chileno */
const rutClean=s=>String(s||'').replace(/[^0-9kK]/g,'').toUpperCase();
function rutDV(b){let s=0,m=2;for(let i=b.length-1;i>=0;i--){s+=Number(b[i])*m;m=m===7?2:m+1}const r=11-(s%11);return r===11?'0':r===10?'K':String(r)}
function rutValid(s){const c=rutClean(s);if(c.length<2)return false;const b=c.slice(0,-1);return /^\d+$/.test(b)&&rutDV(b)===c.slice(-1)}
function rutFmt(s){const c=rutClean(s);if(c.length<2)return String(s||'');return c.slice(0,-1).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'-'+c.slice(-1)}

/* monto en letras */
const UN=['','UN','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE','VEINTE','VEINTIÚN','VEINTIDÓS','VEINTITRÉS','VEINTICUATRO','VEINTICINCO','VEINTISÉIS','VEINTISIETE','VEINTIOCHO','VEINTINUEVE'];
const DE=['','','','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
const CE=['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
function w999(n){if(!n)return '';if(n===100)return 'CIEN';let s='';const c=Math.floor(n/100),r=n%100;if(c)s+=CE[c]+' ';if(r<30)s+=UN[r];else{const u=r%10;s+=DE[Math.floor(r/10)]+(u?' Y '+UN[u]:'')}return s.trim()}
function words(n){if(n===0)return 'CERO';const mm=Math.floor(n/1e6),mi=Math.floor((n%1e6)/1000),re=n%1000,p=[];
  if(mm)p.push(mm===1?'UN MILLÓN':words(mm)+' MILLONES');
  if(mi)p.push(mi===1?'MIL':w999(mi)+' MIL');
  if(re)p.push(w999(re));
  let s=p.join(' ');if(mm&&!mi&&!re)s+=' DE';return s}
const pesosEnLetras=n=>words(Math.round(n))+' PESOS';

/* estado global */
const HOLDER='h'+Math.random().toString(36).slice(2,10);
const S={db:null,user:null,dl:null,canWrite:false,connected:false,ready:false,loaded:{cli:false,doc:false,emp:false,pro:false},
  clientes:[],docs:[],proyectos:[],empresa:{},view:'panel',pjView:'cards',fil:{cotizaciones:'all',facturas:'all',proyectos:'all'},q:{cotizaciones:'',facturas:'',clientes:'',proyectos:''},editor:null};
const EMP_DEF={razon:'',rut:'',giro:'',direccion:'',comuna:'',ciudad:'',email:'',telefono:'',web:'',banco:'',tipoCuenta:'Cuenta corriente',numCuenta:'',titular:'',rutTitular:'',emailPagos:'',cotValidez:15,facPlazo:30,giros:[],
  cotNotas:'Valores expresados en pesos chilenos, más IVA.\nLos precios consideran las condiciones descritas en esta cotización; cualquier trabajo adicional se cotizará por separado.',logo:'',logoW:0,logoH:0};
S.pjOpen=new Set();S.pjCollapsed=new Set();
const emp=()=>Object.assign({},EMP_DEF,S.empresa||{});
const girosList=()=>{const e=emp();return (e.giros&&e.giros.length)?e.giros:(e.giro?[{nombre:e.giro,codigo:'',tipo:33,notas:''}]:[])};
const clientById=id=>S.clientes.find(c=>c.id===id);

/* cálculo */
const IVA_R=0.19;
function secCalc(s){
  const pct=num(s.descPct);
  if(s.tipo==='lotes'){
    const L=s.lotes||[],F=s.filas||[];
    const cols=L.map((_,c)=>{const sub=F.reduce((a,f)=>a+Math.round(num((f.v||[])[c])),0),desc=Math.round(sub*pct/100),neto=sub-desc,iva=Math.round(neto*IVA_R);return {sub,desc,neto,iva,total:neto+iva}});
    const sub=cols.reduce((a,c)=>a+c.sub,0),desc=cols.reduce((a,c)=>a+c.desc,0),neto=sub-desc,iva=Math.round(neto*IVA_R);
    return {sub,desc,neto,iva,total:neto+iva,cols,filas:F.map(f=>(f.v||[]).reduce((a,x)=>a+Math.round(num(x)),0))};
  }
  const gs=(s.grupos||[]).map(g=>(g.items||[]).reduce((a,i)=>a+Math.round(num(i.t)),0));
  const sub=gs.reduce((a,x)=>a+x,0),desc=Math.floor(sub*pct/100+1e-9),neto=sub-desc,iva=Math.round(neto*IVA_R);
  return {sub,desc,neto,iva,total:neto+iva,gs};
}
function totalsOf(d){
  if(d.modo==='propuesta'){const cs=(d.secciones||[]).map(secCalc),z=k=>cs.reduce((a,c)=>a+c[k],0),neto=z('neto'),iva=z('iva');return {sub:z('sub'),desc:z('desc'),neto,iva,total:neto+iva}}
  const items=(d.items||[]);
  const sub=items.reduce((a,l)=>a+Math.round(num(l.q)*num(l.p)),0);
  const desc=Math.round(sub*num(d.descPct)/100);
  const neto=sub-desc;
  const iva=d.tipoDte===34?0:Math.round(neto*0.19);
  return {sub,desc,neto,iva,total:neto+iva};
}
function estadoInfo(d){
  const t=todayS();
  if(d.tipo==='cotizacion'){
    const venc=addD(d.fecha,num(d.validezDias));
    const e=d.estado;
    if(e==='facturada')return {key:'facturada',label:'Facturada',cls:'good'};
    if(e==='aprobada'){const pc=d.neto?Math.round(num(d.facturadoNeto)/d.neto*100):0;return {key:'aprobada',label:pc>0?'Aprobada, '+pc+'% facturado':'Aprobada',cls:'good'}}
    if(e==='rechazada')return {key:'rechazada',label:'Rechazada',cls:'bad'};
    if(e==='enviada'){if(t>venc)return {key:'vencida',label:'Vencida',cls:'warn'};return {key:'enviada',label:'Enviada',cls:'info'}}
    return {key:'borrador',label:'Borrador',cls:''};
  }
  if(d.estado==='anulada')return {key:'anulada',label:'Anulada',cls:''};
  if(d.estado==='pagada')return {key:'pagada',label:'Pagada',cls:'good'};
  const v=addD(d.fecha,num(d.plazoDias)),df=diffD(v,t);
  if(df<0)return {key:'vencida',label:'Vencida hace '+(-df)+' d',cls:'bad'};
  if(df<=7)return {key:'emitida',label:df===0?'Vence hoy':'Vence en '+df+' d',cls:'warn'};
  return {key:'emitida',label:'Por cobrar, '+df+' d',cls:'info'};
}
const venceFac=d=>addD(d.fecha,num(d.plazoDias));

/* utilidades UI */
function setHTML(el,h){if(el._h!==h){el.innerHTML=h;el._h=h}}
function toast(msg,bad){const t=$('#toast');t.textContent=msg;t.className='toast'+(bad?' bad':'');t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true},bad?6500:4200)}
function modal(o){
  const root=$('#modal-root');
  root.innerHTML='<div class="scrim" id="m-scrim"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="m-t"><h2 id="m-t">'+esc(o.title)+'</h2><div id="m-body">'+o.body+'</div><div class="foot">'+(o.actions||[]).map((a,i)=>'<button class="btn '+(a.cls||'')+'" data-mi="'+i+'" id="m-a'+i+'">'+esc(a.label)+'</button>').join('')+'</div></div></div>';
  const close=()=>{root.innerHTML='';document.removeEventListener('keydown',kd)};
  const kd=e=>{if(e.key==='Escape')close()};
  document.addEventListener('keydown',kd);
  $('#m-scrim').addEventListener('mousedown',e=>{if(e.target.id==='m-scrim')close()});
  (o.actions||[]).forEach((a,i)=>{$('#m-a'+i).addEventListener('click',async ev=>{
    const b=ev.currentTarget;if(a.close){close();return}
    b.disabled=true;try{const r=await a.run($('#m-body'));if(r!==false)close()}catch(err){toast(err&&err.message||'No se pudo completar la acción.',true)}finally{b.disabled=false}})});
  if(o.mount)o.mount($('#m-body'),close);
  const f=$('#m-body input,#m-body select,#m-body textarea');if(f&&!o.noFocus)f.focus();
  return close;
}
function confirmBox(title,msg,label,danger){
  return new Promise(res=>{let done=false;
    const fin=v=>{if(!done){done=true;res(v)}};
    modal({title,body:'<p>'+esc(msg)+'</p><div style="height:14px"></div>',actions:[{label:'Cancelar',cls:'ghost',close:true},{label,cls:danger?'danger':'',run:()=>{fin(true)}}],mount:(b,close)=>{const sc=$('#m-scrim');new MutationObserver(()=>{if(!$('#m-scrim'))fin(false)}).observe($('#modal-root'),{childList:true})}});
  });
}

/* base de datos */
const use=async n=>{try{return (await (window.claude&&window.claude.use&&window.claude.use(n)))||null}catch(e){return null}};
const wr=async fn=>{try{return await fn()}catch(e){const m=e&&e.code==='invalid_argument'?'No tienes permiso para modificar datos en esta página.':e&&e.code==='quota_exceeded'?'Se alcanzó el límite de almacenamiento.':e&&!e.code&&e.message?e.message:'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.';toast(m,true);throw e}};
async function nextNumber(tipo){
  const ref=S.db.doc('meta/counter-'+tipo);
  const maxEx=Math.max(0,...S.docs.filter(d=>d.tipo===tipo).map(d=>d.numero||0));
  for(let i=0;i<12;i++){
    const r=await ref.acquire({holder:HOLDER,ttlMs:1000});
    if(r.acquired){const s=await ref.get();const cur=s.exists?num(s.data().n):0;const n=Math.max(cur,maxEx)+1;await ref.set({n});return n}
    await new Promise(r=>setTimeout(r,450+Math.random()*350));
  }
  throw new Error('No se pudo reservar el número del documento. Inténtalo de nuevo.');
}

/* navegación */
const TITLES={panel:'Panel',cotizaciones:'Cotizaciones',facturas:'Facturas',proyectos:'Proyectos',clientes:'Clientes',config:'Datos de la empresa'};
function go(v){
  S.editor=null;S.view=v;
  $$('main > section').forEach(s=>s.hidden=s.id!=='v-'+v);
  $$('#nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.go===v)));
  const m={panel:mountPanel,cotizaciones:()=>mountList('cotizacion'),facturas:()=>mountList('factura'),proyectos:mountProyectos,clientes:mountClientes,config:mountConfig}[v];
  m();window.scrollTo({top:0});
}
function refresh(){
  const nl=S.docs.filter(d=>d.tipo==='factura'&&estadoInfo(d).key==='vencida').length;
  const nc=S.docs.filter(d=>d.tipo==='cotizacion'&&['enviada'].includes(estadoInfo(d).key)).length;
  const a=$('#cnt-fac');a.hidden=!nl;a.textContent=nl;const b=$('#cnt-cot');b.hidden=!nc;b.textContent=nc;
  const np=S.proyectos.filter(p=>pjCalc(p).key==='atraso').length;const c3=$('#cnt-pro');c3.hidden=!np;c3.textContent=np;
  const e=emp();$('#brand-name').textContent=e.razon||'CBC Ingeniería y Construcciones';
  const mk=$('#mark');if(e.logo){mk.innerHTML='<img alt="" src="'+esc(e.logo)+'">'}else{const w=(e.razon||'CBC').split(/\s+/).filter(Boolean);mk.textContent=(w.length>1&&e.razon?(w[0][0]+w[1][0]):'CBC').toUpperCase().slice(0,3)}
  $('#conn').innerHTML=S.db?'<span class="dot"></span>Datos guardados en línea':'<span class="dot off"></span>Sin conexión a la base de datos';
  if(!S.ready||S.editor)return;
  if(S.view==='panel')paintPanel();
  else if(S.view==='cotizaciones')paintList('cotizacion');
  else if(S.view==='facturas')paintList('factura');
  else if(S.view==='clientes')paintClientes();
  else if(S.view==='proyectos')paintProyectos();
}

/* ---------- PANEL ---------- */
function mountPanel(){$('#v-panel').innerHTML='<div class="top"><div><div class="eyebrow">'+cap(WD[todayD().getDay()])+' '+fmtDL(todayS())+'</div><h1>Panel</h1></div><div class="actions"><button class="btn ghost" data-act="new-cot"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nueva cotización</button><button class="btn" data-act="new-fac"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nueva factura</button></div></div><div id="panel-body"></div>';paintPanel()}
function monthKey(s){return s.slice(0,7)}
function paintPanel(){
  const el=$('#panel-body');if(!el)return;
  const facs=S.docs.filter(d=>d.tipo==='factura'&&d.estado!=='anulada');
  const cots=S.docs.filter(d=>d.tipo==='cotizacion');
  const open=facs.filter(d=>d.estado!=='pagada');
  const porCobrar=open.reduce((a,d)=>a+d.total,0);
  const vencidas=open.filter(d=>estadoInfo(d).key==='vencida');
  const vencido=vencidas.reduce((a,d)=>a+d.total,0);
  const mk=monthKey(todayS());
  const mesF=facs.filter(d=>monthKey(d.fecha)===mk);
  const mesNeto=mesF.reduce((a,d)=>a+d.neto,0);
  const abiertas=cots.filter(d=>['enviada'].includes(estadoInfo(d).key));
  const abMonto=abiertas.reduce((a,d)=>a+d.total,0);
  const win=cots.filter(d=>['aprobada','facturada'].includes(d.estado)).length,lost=cots.filter(d=>d.estado==='rechazada').length;
  const rate=win+lost?Math.round(win/(win+lost)*100):null;
  const e=emp();
  const steps=[

  // datos del gráfico
  const months=[];for(let k=5;k>=0;k--){const d=new Date(todayD().getFullYear(),todayD().getMonth()-k,1);months.push({k:d.getFullYear()+'-'+pad(d.getMonth()+1),l:MONTHS[d.getMonth()],f:0,c:0})}
  facs.forEach(d=>{const m=months.find(x=>x.k===monthKey(d.fecha));if(m)m.f+=d.neto;if(d.estado==='pagada'&&d.pago&&d.pago.fecha){const m2=months.find(x=>x.k===monthKey(d.pago.fecha));if(m2)m2.c+=d.neto}});
  drawChart($('#ch'),months);

function drawChart(el,months){
  if(!el)return;
  const mx=Math.max(...months.map(m=>Math.max(m.f,m.c)));
  if(!mx){el.innerHTML='<div class="empty" style="padding:40px 10px"><b>Sin facturas todavía</b>El gráfico se llena cuando emitas tu primera factura.</div>';return}
  const W=Math.max(el.clientWidth,300),H=250,L=62,R=8,T=22,B=26;
  const stepRaw=mx/4,pw=Math.pow(10,Math.floor(Math.log10(stepRaw))),st=[1,2,2.5,5,10].map(x=>x*pw).find(x=>x>=stepRaw);
  const top=st*4,iw=W-L-R,ih=H-T-B,gw=iw/months.length,bw=Math.min(22,(gw-14)/2),y=v=>T+ih-v/top*ih;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Facturado y cobrado por mes">';
  for(let i=0;i<=4;i++){const v=st*i;s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="ax" x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+short(v)+'</text>'}
  months.forEach((m,i)=>{const cx=L+gw*i+gw/2;
    if(m.f)s+='<rect class="bA" x="'+(cx-bw-1)+'" y="'+y(m.f)+'" width="'+bw+'" height="'+(T+ih-y(m.f))+'" rx="3"><title>'+m.l+': facturado '+clp(m.f)+'</title></rect>';
    if(m.c)s+='<rect class="bB" x="'+(cx+1)+'" y="'+y(m.c)+'" width="'+bw+'" height="'+(T+ih-y(m.c))+'" rx="3"><title>'+m.l+': cobrado '+clp(m.c)+'</title></rect>';
    if(i===months.length-1){if(m.f)s+='<text class="vl" x="'+(cx-1)+'" y="'+(y(m.f)-6)+'" text-anchor="end">'+short(m.f)+'</text>';if(m.c)s+='<text class="vl" x="'+(cx+1)+'" y="'+(y(m.c)-6)+'" text-anchor="start">'+short(m.c)+'</text>'}
    s+='<text class="ax" x="'+cx+'" y="'+(H-7)+'" text-anchor="middle">'+m.l+'</text>'});
  el.innerHTML=s+'</svg>';
}

function loadLogo(file){return new Promise((res,rej)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const iw=img.naturalWidth||img.width||300,ih=img.naturalHeight||img.height||100,max=420,sc=Math.min(1,max/iw,max/ih),w=Math.max(1,Math.round(iw*sc)),h=Math.max(1,Math.round(ih*sc));
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
    let data=c.toDataURL('image/png');
    if(data.length>170000){x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);data=c.toDataURL('image/jpeg',.85)}
    URL.revokeObjectURL(url);if(data.length>200000)rej(new Error('La imagen es muy pesada. Usa una más pequeña.'));else res({data,w,h})};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('No se pudo leer la imagen.'))};img.src=url})}

  return true;
}

function cleanSecs(d){
  const out=[];
  for(const s0 of d.secciones){
    const s=JSON.parse(JSON.stringify(s0));
    s.titulo=(s.titulo||'').trim();s.descLabel=(s.descLabel||'').trim();s.descPct=Math.min(100,Math.max(0,num(s.descPct)));
    if(s.tipo==='lotes'){
      s.lotes=s.lotes.map((l,i)=>(l||'').trim()||'Lote N°'+(i+1));
      s.filas=s.filas.filter(f=>(f.d||'').trim()||f.v.some(x=>num(x)));
      if(s.filas.some(f=>!(f.d||'').trim())){toast('Cada partida necesita una descripción.',true);return null}
      s.filas.forEach(f=>{f.d=f.d.trim();f.v=f.v.map(x=>Math.max(0,Math.round(num(x))))});
      if(s.filas.length)out.push(s);
    }else{
      s.grupos.forEach(g=>{g.t=(g.t||'').trim();g.items=g.items.filter(i=>(i.d||'').trim()||num(i.t))});
      s.grupos=s.grupos.filter(g=>g.items.length);
      if(s.grupos.some(g=>g.items.some(i=>!(i.d||'').trim()))){toast('Cada ítem necesita una descripción.',true);return null}
      s.grupos.forEach(g=>g.items.forEach(i=>{i.d=i.d.trim();i.u=(i.u||'').trim();i.q=Math.max(0,num(i.q));i.t=Math.max(0,Math.round(num(i.t)))}));
      if(s.grupos.length)out.push(s);
    }
  }
  if(!out.length||!out.some(s=>secCalc(s).sub>0)){toast('Agrega al menos una partida con precio.',true);return null}
  return out;
}
async function saveDoc(silent){
  const E=S.editor;if(!E||E.saving)return false;
  const d=E.draft,cot=d.tipo==='cotizacion';
  if(!d.clienteId||!clientById(d.clienteId)&&!d.clienteSnap){toast('Selecciona un cliente.',true);return false}
  const prop=d.modo==='propuesta';let items=[],secs=null;
  if(prop){secs=cleanSecs(d);if(!secs)return false}
  else{
  items=d.items.filter(l=>(l.d||'').trim()||num(l.p));
  if(!items.length||items.some(l=>!(l.d||'').trim())){toast('Cada línea necesita una descripción.',true);return false}
  if(items.some(l=>num(l.q)<=0)){toast('Las cantidades deben ser mayores a cero.',true);return false}
  if(!items.some(l=>num(l.p)>0)){toast('Agrega al menos un precio.',true);return false}
  }
  E.saving=true;const b=$('#btn-save');if(b)b.disabled=true;
  try{
    if(prop){d.secciones=secs;d.items=secs.map(x=>({d:x.titulo||'Sección',u:'gl',q:1,p:secCalc(x).neto}))}
    else d.items=items.map(l=>({d:l.d.trim(),u:(l.u||'un').trim(),q:num(l.q),p:num(l.p)}));
    const t=totalsOf(d);
    const cs=snapOf(d.clienteId,d);
    const payload=Object.assign({},d,t,{clienteSnap:cs,descPct:num(d.descPct),actualizado:Date.now()});
    delete payload.id;
    let ref;
    if(!d.id){
      const n=await wr(()=>nextNumber(d.tipo));
      ref=S.db.collection('documentos').doc();
      payload.numero=n;payload.codigo=(cot?'COT-':'FAC-')+String(n).padStart(4,'0');payload.creado=Date.now();
      if(!cot&&payload.estado!=='anulada')payload.estado='emitida';
    }else{ref=S.db.collection('documentos').doc(d.id);payload.creado=d.creado||Date.now()}
    await wr(()=>ref.set(payload));
    // factura nueva desde cotización: actualizar la cotización
    if(!cot&&!d.id&&d.cotizacionId){
      const c=S.docs.find(x=>x.id===d.cotizacionId);
      if(c){const fn=num(c.facturadoNeto)+t.neto;await wr(()=>S.db.collection('documentos').doc(c.id).update({facturadoNeto:fn,estado:fn>=c.neto-1?'facturada':'aprobada',actualizado:Date.now()}))}
    }
    Object.assign(d,payload,{id:ref.id});
    E.dirty=false;
    if(!silent)toast((cot?'Cotización ':'Factura ')+d.codigo+' guardada.');
    $('#ed-code').textContent=d.codigo;paintEditor();
    return true;
  }catch(e){return false}
  finally{E.saving=false;const b2=$('#btn-save');if(b2)b2.disabled=false}
}
async function backToList(){
  const E=S.editor;if(!E)return;
  if(E.dirty&&!isRO()){const ok=await confirmBox('Hay cambios sin guardar','Si vuelves ahora, se perderán los cambios de este documento.','Descartar y volver',true);if(!ok)return}
  go(E.tipo==='cotizacion'?'cotizaciones':E.tipo==='proyecto'?'proyectos':'facturas');
}
function facturarModal(){
  const E=S.editor,c=E.draft,t=totalsOf(c),fn=num(c.facturadoNeto),pend=Math.max(0,t.neto-fn);
  modal({title:'Facturar '+c.codigo,body:

   '<div id="fm-err" class="err" hidden></div>',
   actions:[{label:'Cancelar',cls:'ghost',close:true},{label:'Crear factura',run:async b=>{
     const mode=$('input[name=fm]:checked',b).value,err=$('#fm-err',b);
     let draft=newDraft('factura');
     draft.clienteId=c.clienteId;draft.referencia='Cotización '+c.codigo+(c.referencia?' · '+c.referencia:'');draft.cotizacionId=c.id;draft.cotizacionCodigo=c.codigo;
     if(mode==='all'&&!fn){draft.items=JSON.parse(JSON.stringify(c.items));draft.descPct=c.descPct||0}
     else{
       let amt,label;
       if(mode==='all'){amt=pend;label='Saldo según cotización '+c.codigo}
       else{const p=num($('#fm-pct',b).value);if(!(p>0&&p<=100)){err.textContent='Ingresa un porcentaje entre 1 y 100.';err.hidden=false;return false}amt=Math.round(t.neto*p/100);label=NF2.format(p)+'% según cotización '+c.codigo}
       if(amt>pend+1){err.textContent='El monto supera lo pendiente por facturar ('+clp(pend)+' neto).';err.hidden=false;return false}
       if(amt<=0){err.textContent='No hay saldo pendiente por facturar.';err.hidden=false;return false}

     }

     setTimeout(()=>openEditor('factura',null,draft),0);
   }}]});
}
function payModal(){
  const d=S.editor.draft;

     const f=$('#pg-f',b).value;if(!f){toast('Indica la fecha de pago.',true);return false}
     const pago={fecha:f,medio:$('#pg-m',b).value,ref:$('#pg-r',b).value.trim(),monto:d.total};
     await wr(()=>S.db.collection('documentos').doc(d.id).update({estado:'pagada',pago,actualizado:Date.now()}));
     d.estado='pagada';d.pago=pago;toast('Pago registrado en '+d.codigo+'.');mountEditor();
   }}]});
}
async function voidDoc(){
  const d=S.editor.draft;
  const ok=await confirmBox('Anular '+d.codigo,'La factura queda registrada como anulada y deja de contar como por cobrar. Esta acción no se puede deshacer.','Anular factura',true);if(!ok)return;
  try{
    await wr(()=>S.db.collection('documentos').doc(d.id).update({estado:'anulada',actualizado:Date.now()}));
    if(d.cotizacionId){const c=S.docs.find(x=>x.id===d.cotizacionId);if(c){const fn=Math.max(0,num(c.facturadoNeto)-d.neto);await wr(()=>S.db.collection('documentos').doc(c.id).update({facturadoNeto:fn,estado:'aprobada',actualizado:Date.now()}))}}
    d.estado='anulada';toast(d.codigo+' anulada.');mountEditor();
  }catch(e){}
}
async function delDoc(){
  const d=S.editor.draft;
  const ok=await confirmBox('Eliminar '+d.codigo,'Se borra la cotización de forma permanente.','Eliminar',true);if(!ok)return;
  try{await wr(()=>S.db.collection('documentos').doc(d.id).delete());S.editor.dirty=false;toast('Cotización eliminada.');go('cotizaciones')}catch(e){}
}
function dupDoc(){
  const d=JSON.parse(JSON.stringify(S.editor.draft));
  ['id','numero','codigo','creado','actualizado','facturadoNeto','pago'].forEach(k=>delete d[k]);
  d.estado='borrador';d.fecha=todayS();
  openEditor('cotizacion',null,d);toast('Copia lista. Revísala y guárdala.');
}

const pjDur=t=>Math.max(1,diffD(t.fin,t.inicio)+1);
function pjTree(ts){
  const n=ts.map((t,i)=>({i,t,nivel:Math.max(0,Math.min(3,num(t.nivel))),kids:[],parent:null})),st=[];
  n.forEach(x=>{while(st.length&&st[st.length-1].nivel>=x.nivel)st.pop();if(st.length){x.parent=st[st.length-1];x.parent.kids.push(x)}st.push(x)});
  const valid=t=>t.inicio&&t.fin&&t.fin>=t.inicio,t0=todayS();
  const leaves=n.filter(x=>!x.kids.length&&valid(x.t)),useM=leaves.length>0&&leaves.every(x=>num(x.t.monto)>0);
  for(let k=n.length-1;k>=0;k--){const x=n[k];
    if(!x.kids.length){if(valid(x.t)){const d=pjDur(x.t);x.ok=true;x.ini=x.t.inicio;x.fin=x.t.fin;x.w=useM?num(x.t.monto):d;x.av=num(x.t.avance);x.pl=Math.min(1,Math.max(0,(diffD(t0,x.t.inicio)+1)/d))*100;x.late=diffD(t0,x.t.fin)>0&&x.av<100?1:0}}
    else{const ks=x.kids.filter(c=>c.ok);if(ks.length){x.ok=true;x.ini=ks.map(c=>c.ini).sort()[0];x.fin=ks.map(c=>c.fin).sort().pop();x.w=ks.reduce((a,c)=>a+c.w,0);x.av=x.w?ks.reduce((a,c)=>a+c.av*c.w,0)/x.w:0;x.pl=x.w?ks.reduce((a,c)=>a+c.pl*c.w,0)/x.w:0;x.late=ks.reduce((a,c)=>a+c.late,0)}}
  }
  return {n,leaves,useM};
}
function pjRows(p,base,col){
  const tr=pjTree(p.tareas||[]),rows=[],hid=x=>{for(let q=x.parent;q;q=q.parent)if(col.has(q.t.id))return true;return false};
  tr.n.forEach(x=>{if(!x.ok||hid(x))return;const sum=x.kids.length>0,pc=Math.round(x.av);
    rows.push({label:x.t.nombre||'Sin nombre',start:x.ini,end:x.fin,pct:pc,c:pc>=100?'var(--good)':(diffD(todayS(),x.fin)>0?'var(--bad)':'var(--primary)'),nivel:x.nivel+base,sum,tid:sum?x.t.id:'',open:sum&&!col.has(x.t.id)})});
  return rows;
}
function pjCalc(p){
  const t0=todayS(),tr=pjTree(p.tareas||[]),ts=tr.leaves;
  let w=0,av=0,pl=0,late=0;
  ts.forEach(x=>{w+=x.w;av+=x.av*x.w;pl+=x.pl*x.w;late+=x.late});
  const avance=w?Math.round(av/w):0;
  let plan=w?Math.round(pl/w):0;
  if(!w&&p.fechaInicio&&p.fechaFin&&p.fechaFin>=p.fechaInicio)plan=Math.round(Math.min(1,Math.max(0,(diffD(t0,p.fechaInicio)+1)/(diffD(p.fechaFin,p.fechaInicio)+1)))*100);
  let key,label,cls;
  if(p.estado==='terminado'){key='ok';label='Terminado';cls='good'}
  else if(p.estado==='pausado'){key='pausa';label='Pausado';cls=''}
  else if(p.estado==='planificado'&&p.fechaInicio&&diffD(t0,p.fechaInicio)<0){key='plan';label='Inicia el '+fmtD(p.fechaInicio);cls='info'}
  else if(late||(p.fechaFin&&diffD(t0,p.fechaFin)>0&&avance<100)){key='atraso';label='Atrasado';cls='bad'}
  else if(plan-avance>10){key='riesgo';label='En riesgo';cls='warn'}
  else{key='ok';label='A tiempo';cls='info'}
  return {avance,plan,late,key,label,cls,tareas:ts.length};
}

function projFromCot(c){
  const s0=todayS();
  if(c.modo==='propuesta'){
    const tareas=[];let k=0;
    c.secciones.forEach(sc=>{
      const a=addD(s0,k*21),b=addD(a,20),from=tareas.length;k++;
      tareas.push({id:uid(),nombre:sc.titulo||'Sección '+k,inicio:a,fin:b,avance:0,nivel:0,monto:0});
      const mk=(nombre,monto,nivel)=>tareas.push({id:uid(),nombre,inicio:a,fin:b,avance:0,nivel,monto:Math.max(1,Math.round(monto))});
      if(sc.tipo==='lotes'){sc.lotes.forEach((l,ci)=>{const fs=sc.filas.filter(f=>num(f.v[ci])>0);if(!fs.length)return;tareas.push({id:uid(),nombre:l,inicio:a,fin:b,avance:0,nivel:1,monto:0});fs.forEach(f=>mk(f.d,num(f.v[ci]),2))})}
      else{sc.grupos.forEach(g=>{if(g.t)tareas.push({id:uid(),nombre:g.t,inicio:a,fin:b,avance:0,nivel:1,monto:0});g.items.forEach(it=>mk(it.d,num(it.t),g.t?2:1))})}
      if(tareas.length===from+1)tareas.pop();
    });
    pjTree(tareas).n.forEach(x=>{if(x.kids.length&&x.nivel>=1)S.pjCollapsed.add(x.t.id)});
    openProject(null,{nombre:c.referencia||('Proyecto '+c.codigo),clienteId:c.clienteId,cotizacionId:c.id,cotizacionCodigo:c.codigo,presupuesto:c.neto,estado:'planificado',responsable:'',fechaInicio:s0,fechaFin:tareas.map(t=>t.fin).sort().pop(),notas:'',tareas});
    toast('Partidas creadas desde la cotización, por sección y lote. Ajusta las fechas de cada una.');return;
  }
  const n=Math.max(1,c.items.length),per=Math.max(1,Math.floor(30/n));
  const tareas=c.items.map((l,i)=>({id:uid(),nombre:l.d,inicio:addD(s0,i*per),fin:addD(s0,Math.max(i*per,(i+1)*per-1)),avance:0}));
  openProject(null,{nombre:c.referencia||('Proyecto '+c.codigo),clienteId:c.clienteId,cotizacionId:c.id,cotizacionCodigo:c.codigo,presupuesto:c.neto,estado:'planificado',responsable:'',fechaInicio:s0,fechaFin:tareas.map(t=>t.fin).sort().pop(),notas:'',tareas});
  toast('Tareas creadas desde las líneas de la cotización. Ajusta las fechas.');
}

function pjInput(ev){
  const E=S.editor;if(!E||E.tipo!=='proyecto'||E.example)return;
  const t=ev.target,d=E.draft;
  if(t.dataset.pf){
    const k=t.dataset.pf;d[k]=t.type==='number'?num(t.value):t.value;
    if(k==='cotizacionId'){const c=S.docs.find(x=>x.id===d.cotizacionId);d.cotizacionCodigo=c?c.codigo:'';if(c){if(!d.clienteId){d.clienteId=c.clienteId;$('#pj-cli').value=c.clienteId}if(!num(d.presupuesto)){d.presupuesto=c.neto;$('#pj-pre').value=c.neto}if(!d.nombre.trim()&&c.referencia){d.nombre=c.referencia;$('#pj-nom').value=c.referencia}}}
    E.dirty=true;paintProject();return;
  }
  if(t.dataset.tk!==undefined){
    const i=+t.dataset.ti,k=t.dataset.tk,tk=d.tareas[i];if(!tk)return;
    tk[k]=k==='avance'||k==='monto'?num(t.value):t.value;
    if(k==='avance'){const o=$('#tv-'+i);if(o)o.textContent=tk.avance+'%'}
    E.dirty=true;paintProject();
  }
}

async function saveProject(){
  const E=S.editor,d=E.draft;if(E.saving)return false;
  if(!d.nombre.trim()){toast('Escribe el nombre del proyecto.',true);return false}
  if(!d.clienteId||!clientById(d.clienteId)){toast('Selecciona un cliente.',true);return false}
  if(!d.fechaInicio||!d.fechaFin||d.fechaFin<d.fechaInicio){toast('Revisa las fechas: el término debe ser igual o posterior al inicio.',true);return false}
  const ts=d.tareas.filter(t=>(t.nombre||'').trim()||t.inicio);
  const isSum=ts.map((t,i)=>i+1<ts.length&&num(ts[i+1].nivel)>num(t.nivel));
  for(let i=0;i<ts.length;i++){const t=ts[i];if(!(t.nombre||'').trim()||(!isSum[i]&&(!t.inicio||!t.fin||t.fin<t.inicio))){toast('Revisa la tarea «'+(t.nombre||'sin nombre')+'»: necesita nombre y fechas válidas.',true);return false}}
  E.saving=true;const b=$('#btn-save');if(b)b.disabled=true;
  try{
    d.tareas=ts.map(t=>({id:t.id||uid(),nombre:t.nombre.trim(),inicio:t.inicio||'',fin:t.fin||'',avance:Math.min(100,Math.max(0,num(t.avance))),nivel:Math.max(0,Math.min(3,num(t.nivel))),monto:Math.max(0,num(t.monto))}));
    pjTree(d.tareas).n.forEach(x=>{if(x.kids.length&&x.ok){x.t.inicio=x.ini;x.t.fin=x.fin;x.t.avance=Math.round(x.av);x.t.monto=0}});
    const c=pjCalc(d);let auto='';
    if(d.tareas.length&&c.avance===100&&d.estado!=='terminado'){d.estado='terminado';auto=' Todas las tareas están al 100%: quedó como terminado.'}
    else if(c.avance>0&&d.estado==='planificado'){d.estado='en_curso';auto=' Hay avance registrado: quedó en curso.'}
    const cs=clientById(d.clienteId);
    const payload=Object.assign({},d,{presupuesto:num(d.presupuesto),clienteSnap:{razon:cs.razon},actualizado:Date.now()});delete payload.id;
    const ref=d.id?S.db.collection('proyectos').doc(d.id):S.db.collection('proyectos').doc();
    payload.creado=d.creado||Date.now();
    await wr(()=>ref.set(payload));
    Object.assign(d,payload,{id:ref.id});E.dirty=false;
    toast('Proyecto guardado.'+auto);mountProject();return true;
  }catch(e){return false}
  finally{E.saving=false;const b2=$('#btn-save');if(b2)b2.disabled=false}
}

  try{await wr(()=>S.db.collection('proyectos').doc(d.id).delete());S.editor.dirty=false;toast('Proyecto eliminado.');go('proyectos')}catch(e){}
}

  const pf=t.closest('[data-pdf]');if(pf){ev.stopPropagation();const d=S.docs.find(x=>x.id===pf.dataset.pdf);if(d)downloadPdf(d);return}
  const op=t.closest('[data-open]');if(op){const d=S.docs.find(x=>x.id===op.dataset.open);if(d)openEditor(d.tipo,d);return}
  const cc=t.closest('[data-cli]');if(cc){clientModal(cc.dataset.cli);return}
  const fl=t.closest('[data-fil]');if(fl){S.fil[fl.dataset.t==='cotizacion'?'cotizaciones':'facturas']=fl.dataset.fil;paintList(fl.dataset.t);return}
  const pj=t.closest('[data-proj]');if(pj){if(!await leaveOk())return;const p=S.proyectos.find(x=>x.id===pj.dataset.proj);if(p)openProject(p);return}
  const pf2=t.closest('[data-pfil]');if(pf2){S.fil.proyectos=pf2.dataset.pfil;paintProyectos();return}
  const pv=t.closest('[data-pjv]');if(pv){S.pjView=pv.dataset.pjv;paintProyectos();return}
  const a=t.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='new-cot')startNew('cotizacion');
  else if(act==='new-fac')startNew('factura');
  else if(act==='new-proj')startProject();
  else if(act==='example-cot')openEditor('cotizacion',null,exampleCot(),true);
  else if(act==='example-pj')openProject(null,exampleProject(),true);
  else if(act==='proj-from-cot'){if(S.editor.dirty){if(!await saveDoc(true))return}projFromCot(S.editor.draft)}
  else if(act==='pj-save')saveProject();
  else if(act==='pj-del')delProject();
  else if(act==='pj-add'){const ts=S.editor.draft.tareas,last=ts[ts.length-1],ini=last&&last.fin?addD(last.fin,1):S.editor.draft.fechaInicio;ts.push({id:uid(),nombre:'',inicio:ini,fin:addD(ini,6),avance:0,nivel:0,monto:0});S.editor.dirty=true;fillTasks();paintProject();const ins=$$('#pj-tasks [data-tk=nombre]');ins[ins.length-1].focus()}
  else if(act==='pj-sub'||act==='pj-in'||act==='pj-out'||act==='pj-rm'){
    const ts=S.editor.draft.tareas,i=+a.dataset.i,lv=num(ts[i].nivel);let end=i;while(end+1<ts.length&&num(ts[end+1].nivel)>lv)end++;
    if(act==='pj-sub'){if(lv>=3){toast('Se permiten hasta 4 niveles.',true);return}
      const kids=ts.slice(i+1,end+1).filter(x=>num(x.nivel)===lv+1),lastK=kids[kids.length-1],ini=lastK&&lastK.fin?addD(lastK.fin,1):(ts[i].inicio||S.editor.draft.fechaInicio);
      ts.splice(end+1,0,{id:uid(),nombre:'',inicio:ini,fin:addD(ini,6),avance:0,nivel:lv+1,monto:0});S.pjCollapsed.delete(ts[i].id);
      S.editor.dirty=true;fillTasks();paintProject();const nm=$$('#pj-tasks [data-tk=nombre]').find(e=>+e.dataset.ti===end+1);if(nm)nm.focus();return}
    if(act==='pj-in'){const mx=Math.max(...ts.slice(i,end+1).map(x=>num(x.nivel)));if(i===0||lv>=num(ts[i-1].nivel)+1||mx>=3){toast(i===0?'La primera tarea no puede ser subtarea.':'No se puede bajar más este nivel.',true);return}ts.slice(i,end+1).forEach(x=>x.nivel=num(x.nivel)+1)}
    else if(act==='pj-out'){if(lv===0)return;ts.slice(i,end+1).forEach(x=>x.nivel=num(x.nivel)-1)}
    else{if(end>i){const ok=await confirmBox('Quitar con sus subtareas','Esta tarea tiene '+(end-i)+' subtarea'+(end-i===1?'':'s')+'. Se quitan todas.','Quitar',true);if(!ok)return}ts.splice(i,end-i+1)}
    S.editor.dirty=true;fillTasks();paintProject()}
  else if(act==='pj-expand'){S.pjCollapsed.clear();fillTasks();paintProject()}
  else if(act==='pj-collapse'){pjTree(S.editor.draft.tareas).n.forEach(x=>{if(x.kids.length)S.pjCollapsed.add(x.t.id)});fillTasks();paintProject()}
  else if(act==='pl-expand'){S.proyectos.forEach(p=>S.pjOpen.add(p.id));S.pjCollapsed.clear();paintProyectos()}
  else if(act==='pl-collapse'){S.pjOpen.clear();paintProyectos()}
  else if(act==='new-cli'){if(!S.canWrite){toast('Necesitas acceso de colaborador para crear clientes.',true);return}clientModal(null)}
  else if(act==='csv')exportCsv(a.dataset.t);
  else if(act==='back')backToList();
  else if(act==='save')saveDoc();
  else if(act==='add-item'){S.editor.draft.items.push({d:'',u:'un',q:1,p:0});fillItems();paintEditor();const ins=$$('#ed-items .d');ins[ins.length-1].focus()}
  else if(act==='rm-item'){const it=S.editor.draft.items;if(it.length>1){it.splice(+a.dataset.i,1);S.editor.dirty=true;fillItems();paintEditor()}}
  else if(act==='cli-new-ed')clientModal(null,(id)=>{S.editor.draft.clienteId=id;S.editor.dirty=true;mountEditor();paintEditor()});
  else if(act==='pdf-ed'){const d=S.editor.draft,tt=totalsOf(d);downloadPdf(Object.assign({},d,tt,{clienteSnap:snapOf(d.clienteId,d),codigo:d.codigo||(d.tipo==='cotizacion'?'BORRADOR':'FACTURA-BORRADOR')}))}
  else if(act==='dup')dupDoc();
  else if(act==='del')delDoc();
  else if(act==='void')voidDoc();
  else if(act==='pay'){if(S.editor.dirty){if(!await saveDoc(true))return}payModal()}
  else if(act==='facturar'){if(S.editor.dirty){if(!await saveDoc(true))return}facturarModal()}
  else if(act==='dte-json'){const d=S.editor.draft;if(!S.dl){toast('La descarga no está disponible en esta vista.',true);return}
    try{await S.dl.save({filename:(d.codigo||'factura-borrador')+'-datos-sii.json',data:JSON.stringify(dteJson(Object.assign({},d,{clienteSnap:snapOf(d.clienteId,d)})),null,2)});toast('Archivo guardado.')}catch(e){if(!e||e.code!=='declined')toast('No se pudo guardar el archivo.',true)}}
  else if(secAct(act,a)){}
});

/* ---------- arranque ---------- */
function checkReady(){
  if(S.ready)return;
  if(S.loaded.cli&&S.loaded.doc&&S.loaded.emp&&S.loaded.pro){S.ready=true;const h=(location.hash||'').replace('#','');go(['panel','cotizaciones','facturas','proyectos','clientes','config'].includes(h)?h:'panel')}
}
async function boot(){
  refresh();
  const [db,user,dl]=await Promise.all([use('db'),use('user'),use('downloads')]);
  S.db=db;S.user=user;S.dl=dl;
  S.canWrite=!!db&&!(user&&user.can&&user.can('data.write')===false);
  if(!db){S.ready=true;S.loaded={cli:true,doc:true,emp:true,pro:true};refresh();$('#v-panel').innerHTML='<div class="empty"><b>No se pudo conectar con la base de datos</b>Abre esta página desde tu cuenta de Claude con la sesión iniciada para ver y guardar cotizaciones y facturas.</div>';return}
  const fail=e=>{toast('No se pudo leer la información guardada.',true)};
  setTimeout(()=>{if(!S.ready){S.loaded={cli:true,doc:true,emp:true,pro:true};checkReady()}},7000);
  db.collection('proyectos').onSnapshot(sn=>{S.proyectos=sn.docs.map(d=>Object.assign({id:d.id},d.data()));S.loaded.pro=true;checkReady();refresh()},fail);
  db.collection('clientes').onSnapshot(sn=>{S.clientes=sn.docs.map(d=>Object.assign({id:d.id},d.data()));S.loaded.cli=true;checkReady();refresh()},fail);
  db.collection('documentos').onSnapshot(sn=>{S.docs=sn.docs.map(d=>Object.assign({id:d.id},d.data()));S.loaded.doc=true;checkReady();refresh()},fail);
  db.doc('meta/empresa').onSnapshot(sn=>{S.empresa=sn.exists?sn.data():{};S.loaded.emp=true;checkReady();refresh()},fail);
}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.ready&&S.view==='panel')paintPanel()},180)});
boot();
})();
</script>
